[package]
name = "omaphoenix-gui"
description = "OmaPhoenix desktop app (Slint): the joint product's six sections, on the same engine as the CLI and TUI"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace until Q9/Q10 are decided (docs/07): Slint is
# GPL-3.0 / Royalty-free / commercial, which cargo-deny's policy blocks.
[workspace]

[dependencies]
phx-contract = { path = "../../crates/phx-contract" }
phx-core = { path = "../../crates/phx-core" }
phx-audit = { path = "../../crates/phx-audit" }
slint = "1.18"
toml = "1"

[build-dependencies]
slint-build = "1.18"

[lints.rust]
# deny, not forbid: Slint's generated code allows unsafe internally, and
# forbid can't be overridden even there. Our own code still can't use it.
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
