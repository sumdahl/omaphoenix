# From Manish Karki's secaudit (extras/sysctl), MIT (ADR-0026).
# Kernel hardening flagged by secaudit. Install with: install.sh --sysctl
# Named to sort after 50-coredump.conf and 99-omarchy-sysctl.conf so these win.

# Hide kernel pointers in /proc/kallsyms etc. from everyone (aids KASLR).
# Note: perf/bpftrace symbol resolution as a normal user needs sudo.
kernel.kptr_restrict=2

# Block loading a replacement kernel at runtime. One-way until reboot.
kernel.kexec_load_disabled=1

# No core dumps from setuid/privilege-changing processes (they may hold secrets).
# Normal app crashes still reach systemd-coredump.
fs.suid_dumpable=0

# This host is not a router; don't send ICMP redirects (Docker/libvirt NAT unaffected).
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0

# Log packets with impossible source addresses (spoofing indicator).
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1
