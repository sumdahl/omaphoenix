# cargo-deny: licenses, advisories, bans, sources (RUST.md §7).
[graph]
all-features = true

[advisories]
# An exception that no longer matches fails the check, so it gets removed the day a fix lands.
unused-ignored-advisory = "deny"
version = 2
yanked = "deny"
# Every exception says why it's safe and when it goes. Unmaintained crates may be ignored when a
# dependency we can't replace pulls them in. A vulnerability is ignored only when no fixed version
# can be used and the affected code never runs on our data; the weekly advisories workflow fails
# when such an exception stops matching, so it's removed as soon as the fix lands.
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing issue, via age 0.12.1 (latest) → p256/elliptic-curve 0.13, a non-optional dependency. OmaPhoenix only uses age's x25519 recipients and scrypt passphrases (secret/keys.rs, secret/mod.rs), never P-256, so the affected code never runs on our data. The fix (0.7.6) needs elliptic-curve 0.14; drop this when age moves to it." },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml (unmaintained) via age's i18n-embed: a compile-time proc macro reading age's own i18n.toml, never user input; age 0.12.1 is the latest. Drop when age moves off i18n-embed-fl or basic-toml." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk-rs 0.18 (GTK3 bindings, required by Tauri on Linux)" },
  { id = "RUSTSEC-2025-0075", reason = "unic-* via urlpattern via tauri-utils" },
  { id = "RUSTSEC-2025-0080", reason = "unic-* via urlpattern via tauri-utils" },
  { id = "RUSTSEC-2025-0081", reason = "unic-* via urlpattern via tauri-utils" },
  { id = "RUSTSEC-2025-0098", reason = "unic-* via urlpattern via tauri-utils" },
  { id = "RUSTSEC-2025-0100", reason = "unic-* via urlpattern via tauri-utils" },
]

[licenses]
version = 2
# Our own crates are unpublished (publish = false) until the handover.
private = { ignore = true }
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  # Servo's cssparser/selectors (via Tauri). File-level weak copyleft: using
  # them unmodified as dependencies is compatible with an MIT/Apache project;
  # obligations apply only to changes in those crates' own files. Noted on the
  # license question (issue #1).
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
