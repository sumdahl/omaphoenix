[package]
name = "slint-desktop-spike"
description = "OmaPhoenix desktop on Slint: GUI-stack spike (issue #19)"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone until the GUI stack is decided (Q9, #11).
[workspace]

[dependencies]
slint = "1.18"
toml = "0.9"
serde_json = "1"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
