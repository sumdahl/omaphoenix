[workspace]
resolver = "3"
members = ["crates/*"]
# Throwaway measurement projects, each its own workspace (see their README).
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# 1.88: patched `time` (RUSTSEC) and `plist`/`quick-xml` need it; holding an
# older MSRV pinned vulnerable versions.
rust-version = "1.88"
repository = "https://github.com/sumdahl/omaphoenix-secaudit"
license = "MIT OR Apache-2.0" # ADR-0015
# Unpublished until the handover (ADR-0013).
publish = false

[workspace.dependencies]
secaudit-core = { path = "crates/secaudit-core" }
clap = { version = "4", features = ["derive"] }
phx-contract = { path = "crates/phx-contract" }
proptest = "1"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
