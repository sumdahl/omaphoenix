[workspace]
resolver = "3"
members = ["crates/*"]
# Throwaway measurement projects, and apps waiting on a decision (apps/: the
# Slint desktop, Q9/Q10), each its own workspace so CI and cargo-deny skip them.
exclude = ["spikes", "apps"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# 1.88: patched `time` (RUSTSEC) and `plist`/`quick-xml` need it; holding an
# older MSRV pinned vulnerable versions. 1.89: `File::try_lock` (the snapshot
# repo lock) without a libc-wrapping crate.
rust-version = "1.89"
repository = "https://github.com/sumdahl/omaphoenix"
license = "MIT" # ADR-0026
# Unpublished until the handover (ADR-0013).
publish = false

[workspace.dependencies]
phx-audit = { path = "crates/phx-audit" }
phx-audit-ui = { path = "crates/phx-audit-ui" }
clap = { version = "4", features = ["derive"] }
phx-contract = { path = "crates/phx-contract" }
phx-core = { path = "crates/phx-core" }
proptest = "1"
age = "0.12"
sha2 = "0.11"
zeroize = "1"
ratatui = "0.30"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tar = "0.4"
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# age's passphrase stretching (scrypt) takes ~20 s unoptimised; tests and
# debug runs that open a vault need it fast.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
